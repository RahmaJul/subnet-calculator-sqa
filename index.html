<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Subnet & VLSM Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  /* === DESIGN TOKENS ===
     Layout: centered card, max 680px, two tabs side by side
     Palette: white bg, slate-tinted neutrals, blue-500 accent
     Type: Inter UI + JetBrains Mono for addresses */

  :root {
    --bg:          #f8f9fb;
    --surface:     #ffffff;
    --border:      #e2e6ed;
    --muted:       #8d95a3;
    --text:        #1a1f2e;
    --text-soft:   #4a5568;
    --accent:      #2563eb;
    --accent-bg:   #eff4ff;
    --accent-hover:#1d4ed8;
    --success:     #059669;
    --success-bg:  #ecfdf5;
    --error:       #dc2626;
    --error-bg:    #fef2f2;
    --shadow:      0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --border:      #2a2f3d;
      --muted:       #6b7280;
      --text:        #e8ecf3;
      --text-soft:   #9ca3af;
      --accent:      #3b82f6;
      --accent-bg:   #1e2a4a;
      --accent-hover:#60a5fa;
      --success:     #10b981;
      --success-bg:  #0a2e22;
      --error:       #f87171;
      --error-bg:    #2d1a1a;
      --shadow:      0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:          #0f1117;
    --surface:     #1a1d27;
    --border:      #2a2f3d;
    --muted:       #6b7280;
    --text:        #e8ecf3;
    --text-soft:   #9ca3af;
    --accent:      #3b82f6;
    --accent-bg:   #1e2a4a;
    --accent-hover:#60a5fa;
    --success:     #10b981;
    --success-bg:  #0a2e22;
    --error:       #f87171;
    --error-bg:    #2d1a1a;
    --shadow:      0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
  }

  .page {
    max-width: 660px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    margin-bottom: 28px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .header p {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* Tab nav */
  .tab-nav {
    display: flex;
    gap: 2px;
    background: var(--border);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 20px;
    width: fit-content;
  }
  .tab-btn {
    padding: 7px 20px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .tab-btn:hover:not(.active) {
    color: var(--text-soft);
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  /* Form */
  .form-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .field-ip { flex: 2; min-width: 160px; }
  .field-prefix { flex: 1; min-width: 90px; }

  label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-soft);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus,
  input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }
  input.error-input {
    border-color: var(--error);
    box-shadow: 0 0 0 3px var(--error-bg);
  }

  .btn-calc {
    padding: 9px 22px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, transform .1s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .btn-calc:hover { background: var(--accent-hover); }
  .btn-calc:active { transform: scale(.98); }

  .err-msg {
    color: var(--error);
    font-size: 12.5px;
    margin-top: 6px;
  }

  /* Result card */
  .result {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 480px) {
    .result-grid { grid-template-columns: 1fr; }
  }
  .result-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .result-item.full { grid-column: 1 / -1; }
  .result-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .result-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .result-value.accent { color: var(--accent); }
  .result-badge {
    display: inline-block;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    margin-top: 2px;
  }

  /* VLSM */
  .vlsm-network-row {
    margin-bottom: 16px;
  }
  .vlsm-hosts-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }
  .host-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .host-row input {
    flex: 1;
    max-width: 160px;
  }
  .btn-remove {
    padding: 7px 10px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
    transition: border-color .15s, color .15s;
  }
  .btn-remove:hover { border-color: var(--error); color: var(--error); }

  .btn-add {
    padding: 7px 14px;
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    margin-top: 4px;
  }
  .btn-add:hover { border-color: var(--accent); color: var(--accent); }

  .vlsm-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
  }

  /* VLSM result table */
  .table-wrap {
    overflow-x: auto;
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text-soft);
    font-family: 'JetBrains Mono', monospace;
  }
  td.num { color: var(--text); font-weight: 500; }
  td.cidr { color: var(--accent); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }

  /* Status badge */
  .success-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--success-bg);
    color: var(--success);
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .error-banner {
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13.5px;
    margin-top: 16px;
  }

  [hidden] { display: none !important; }
</style>

<div class="page">
  <div class="header">
    <h1>Subnet & VLSM Calculator</h1>
    <p>Kalkulator IPv4 untuk subnetting dan alokasi VLSM</p>
  </div>

  <div class="tab-nav" role="tablist">
    <button class="tab-btn active" id="tab-subnet" role="tab" aria-selected="true" aria-controls="panel-subnet" onclick="switchTab('subnet')">Subnet</button>
    <button class="tab-btn" id="tab-vlsm" role="tab" aria-selected="false" aria-controls="panel-vlsm" onclick="switchTab('vlsm')">VLSM</button>
  </div>

  <!-- SUBNET PANEL -->
  <div id="panel-subnet" role="tabpanel">
    <div class="card">
      <div class="form-row">
        <div class="field field-ip">
          <label for="ip">Alamat IP</label>
          <input type="text" id="ip" placeholder="192.168.1.0" autocomplete="off" spellcheck="false">
        </div>
        <div class="field field-prefix">
          <label for="prefix">Prefix</label>
          <input type="number" id="prefix" placeholder="24" min="0" max="32">
        </div>
        <button class="btn-calc" onclick="hitungSubnet()">Hitung</button>
      </div>
      <div id="subnet-err" class="error-banner" hidden></div>

      <div id="subnet-result" class="result" hidden>
        <div class="success-badge"><span class="dot"></span> Sukses</div>
        <div class="result-grid">
          <div class="result-item">
            <div class="result-label">Subnet Mask</div>
            <div class="result-value" id="res-mask">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Usable Hosts</div>
            <div class="result-value accent" id="res-hosts">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Network Address</div>
            <div class="result-value" id="res-network">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Broadcast Address</div>
            <div class="result-value" id="res-broadcast">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">First Host</div>
            <div class="result-value" id="res-first">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Last Host</div>
            <div class="result-value" id="res-last">—</div>
          </div>
        </div>
        <div id="res-special" style="margin-top:12px"></div>
      </div>
    </div>
  </div>

  <!-- VLSM PANEL -->
  <div id="panel-vlsm" role="tabpanel" hidden>
    <div class="card">
      <div class="vlsm-network-row">
        <div class="field">
          <label for="vlsm-network">Network (CIDR)</label>
          <input type="text" id="vlsm-network" placeholder="192.168.1.0/24" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="vlsm-hosts-label">Kebutuhan Host</div>
      <div id="host-rows"></div>
      <button class="btn-add" onclick="tambahBaris()">+ Tambah kebutuhan</button>

      <div id="vlsm-err" class="error-banner" hidden></div>

      <div class="vlsm-actions">
        <button class="btn-calc" onclick="hitungVLSM()">Hitung VLSM</button>
      </div>

      <div id="vlsm-result" class="table-wrap" hidden>
        <div class="success-badge"><span class="dot"></span> Sukses</div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Kebutuhan</th>
              <th>Network CIDR</th>
              <th>Range Host</th>
              <th>Usable</th>
            </tr>
          </thead>
          <tbody id="vlsm-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  /* ── Tab switch ── */
  function switchTab(name) {
    ['subnet','vlsm'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('active', t === name);
      document.getElementById('tab-' + t).setAttribute('aria-selected', t === name);
      document.getElementById('panel-' + t).hidden = t !== name;
    });
  }

  /* ── VLSM baris kebutuhan ── */
  let barisCount = 0;
  function tambahBaris(value = '') {
    barisCount++;
    const id = 'host-' + barisCount;
    const wrap = document.getElementById('host-rows');
    const div = document.createElement('div');
    div.className = 'host-row';
    div.id = 'row-' + id;
    div.innerHTML = `
      <input type="number" id="${id}" placeholder="Jumlah host, misal 50" min="1" value="${value}">
      <button class="btn-remove" onclick="hapusBaris('row-${id}')" aria-label="Hapus baris">×</button>`;
    wrap.appendChild(div);
  }
  function hapusBaris(rowId) {
    const el = document.getElementById(rowId);
    if (el) el.remove();
  }
  // Seed 3 baris awal
  tambahBaris(100); tambahBaris(50); tambahBaris(20);

  /* ── Validasi & hitung (lokal, digunakan saat backend tidak tersedia) ── */
  function ipToInt(ip) {
    // tolak spasi
    if (ip !== ip.trim()) throw new Error('Alamat IP tidak boleh mengandung spasi.');
    const parts = ip.split('.');
    if (parts.length !== 4) throw new Error('Alamat IP harus tepat 4 oktet.');
    return parts.reduce((acc, part) => {
      if (!/^\d+$/.test(part)) throw new Error(`Oktet "${part}" bukan angka valid.`);
      if (part.length > 1 && part[0] === '0') throw new Error(`Oktet "${part}" mengandung angka nol di depan.`);
      const n = parseInt(part, 10);
      if (n < 0 || n > 255) throw new Error(`Oktet "${part}" di luar rentang 0–255.`);
      return (acc << 8) | n;
    }, 0) >>> 0;
  }
  function intToIp(n) {
    return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
  }
  function hitungLokal(ip, prefix) {
    if (!ip) throw new Error('Alamat IP tidak boleh kosong.');
    const p = parseInt(prefix, 10);
    if (isNaN(p) || !Number.isInteger(p) || p < 0 || p > 32)
      throw new Error('Prefix harus bilangan bulat 0–32.');
    const ipInt = ipToInt(ip);
    const maskInt = p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0;
    const netInt  = (ipInt & maskInt) >>> 0;
    const mask    = intToIp(maskInt);
    const network = intToIp(netInt);
    if (p === 32) return { mask, network, broadcast: null, first_host: ip, last_host: ip, usable_hosts: 1, special: '/32 — host route' };
    if (p === 31) {
      const a = intToIp(netInt), b = intToIp((netInt | 1) >>> 0);
      return { mask, network, broadcast: null, first_host: a, last_host: b, usable_hosts: 2, special: '/31 — RFC 3021 point-to-point' };
    }
    const wildcard  = (~maskInt) >>> 0;
    const bcInt     = (netInt | wildcard) >>> 0;
    const broadcast = intToIp(bcInt);
    const first     = intToIp((netInt + 1) >>> 0);
    const last      = intToIp((bcInt - 1) >>> 0);
    const usable    = Math.pow(2, 32 - p) - 2;
    return { mask, network, broadcast, first_host: first, last_host: last, usable_hosts: usable, special: null };
  }

  function alokasi(networkCidr, kebutuhanList) {
    const [netIp, prefStr] = networkCidr.split('/');
    const netPrefix = parseInt(prefStr, 10);
    if (!netIp || isNaN(netPrefix)) throw new Error('Format network CIDR tidak valid.');
    const netInt = ipToInt(netIp);
    const maskInt = netPrefix === 0 ? 0 : (0xFFFFFFFF << (32 - netPrefix)) >>> 0;
    if ((netInt & maskInt) >>> 0 !== netInt) throw new Error('network_cidr bukan alamat jaringan (host bit aktif).');
    if (!kebutuhanList.length) throw new Error('Daftar kebutuhan host kosong.');
    kebutuhanList.forEach(k => { if (k < 1) throw new Error('Nilai kebutuhan harus ≥ 1.'); });

    const urut = [...kebutuhanList].map((k,i) => ({k,i})).sort((a,b) => b.k - a.k);
    const totalAlamat = Math.pow(2, 32 - netPrefix);
    const totalDibutuhkan = urut.reduce((s, {k}) => {
      let size = 2;
      while (size < k + 2) size *= 2;
      return s + size;
    }, 0);
    if (totalDibutuhkan > totalAlamat) throw new Error('Ruang alamat tidak cukup untuk seluruh kebutuhan.');

    let ptr = netInt;
    return urut.map(({k}) => {
      let size = 2;
      while (size < k + 2) size *= 2;
      const blokPrefix = 32 - Math.log2(size);
      const sub = hitungLokal(intToIp(ptr), blokPrefix);
      const cidr = intToIp(ptr) + '/' + blokPrefix;
      ptr = (ptr + size) >>> 0;
      return { kebutuhan: k, network_cidr: cidr, ...sub };
    });
  }

  /* ── Subnet UI ── */
  async function hitungSubnet() {
    const ip     = document.getElementById('ip').value.trim();
    const prefix = document.getElementById('prefix').value;
    const errEl  = document.getElementById('subnet-err');
    const resEl  = document.getElementById('subnet-result');
    errEl.hidden = true;
    resEl.hidden = true;
    document.getElementById('ip').classList.remove('error-input');

    try {
      // Coba endpoint API dulu
      let data;
      try {
        const r = await fetch(`/api/subnet?ip=${encodeURIComponent(ip)}&prefix=${encodeURIComponent(prefix)}`);
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j.detail || `HTTP ${r.status}`);
        }
        data = await r.json();
      } catch (fetchErr) {
        // Fallback: hitung lokal jika API tidak tersedia
        if (fetchErr.message.startsWith('HTTP') || fetchErr.message.includes('detail')) throw fetchErr;
        data = hitungLokal(ip, prefix);
      }

      document.getElementById('res-mask').textContent     = data.mask;
      document.getElementById('res-hosts').textContent    = data.usable_hosts.toLocaleString('id-ID');
      document.getElementById('res-network').textContent  = data.network;
      document.getElementById('res-broadcast').textContent= data.broadcast ?? '— (tidak ada)';
      document.getElementById('res-first').textContent    = data.first_host;
      document.getElementById('res-last').textContent     = data.last_host;
      const sp = document.getElementById('res-special');
      sp.innerHTML = data.special ? `<span class="result-badge">${data.special}</span>` : '';
      resEl.hidden = false;
    } catch (e) {
      document.getElementById('ip').classList.add('error-input');
      errEl.textContent = e.message;
      errEl.hidden = false;
    }
  }

  /* ── VLSM UI ── */
  async function hitungVLSM() {
    const network = document.getElementById('vlsm-network').value.trim();
    const errEl   = document.getElementById('vlsm-err');
    const resEl   = document.getElementById('vlsm-result');
    errEl.hidden  = true;
    resEl.hidden  = true;
    document.getElementById('vlsm-network').classList.remove('error-input');

    const inputs  = document.querySelectorAll('#host-rows input[type="number"]');
    const kebutuhan = [];
    for (const inp of inputs) {
      const v = parseInt(inp.value, 10);
      if (!isNaN(v)) kebutuhan.push(v);
    }

    try {
      let hasil;
      try {
        const r = await fetch('/api/vlsm', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ network, kebutuhan_host: kebutuhan })
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j.detail || `HTTP ${r.status}`);
        }
        hasil = await r.json();
      } catch (fetchErr) {
        if (fetchErr.message.startsWith('HTTP') || fetchErr.message.includes('detail')) throw fetchErr;
        hasil = alokasi(network, kebutuhan);
      }

      const tbody = document.getElementById('vlsm-tbody');
      tbody.innerHTML = '';
      hasil.forEach((row, i) => {
        const tr = document.createElement('tr');
        const range = row.broadcast
          ? `${row.first_host} – ${row.last_host}`
          : `${row.first_host} / ${row.last_host}`;
        tr.innerHTML = `
          <td class="num">${i+1}</td>
          <td class="num">${row.kebutuhan}</td>
          <td class="cidr">${row.network_cidr}</td>
          <td>${range}</td>
          <td class="num">${row.usable_hosts.toLocaleString('id-ID')}</td>`;
        tbody.appendChild(tr);
      });
      resEl.hidden = false;
    } catch (e) {
      document.getElementById('vlsm-network').classList.add('error-input');
      errEl.textContent = e.message;
      errEl.hidden = false;
    }
  }

  /* Enter key support */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.activeElement.closest('#panel-subnet')) hitungSubnet();
    else if (document.activeElement.closest('#panel-vlsm')) hitungVLSM();
  });
</script>

</body></html>
