<!doctype html>
<html>
<head>
  <meta charset="utf8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Subnet & VLSM Calculator Rahma</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="header">
    <h1>Subnet & VLSM Calculator Rahma juli</h1>
    <p>Kalkulator IPv4 untuk subnetting dan alokasi VLSM</p>
  </div>

  <div class="tab-nav" role="tablist">
    <button class="tab-btn active" id="tab-subnet" role="tab" aria-selected="true" aria-controls="panel-subnet" onclick="switchTab('subnet')">Subnet</button>
    <button class="tab-btn" id="tab-vlsm" role="tab" aria-selected="false" aria-controls="panel-vlsm" onclick="switchTab('vlsm')">VLSM</button>
  </div>

  <!-- SUBNET PANEL -->
  <div id="panel-subnet" role="tabpanel">
    <div class="card">
      <div class="form-row">
        <div class="field field-ip">
          <label for="ip">Alamat IP</label>
          <input type="text" id="ip" placeholder="192.168.1.0" autocomplete="off" spellcheck="false">
        </div>
        <div class="field field-prefix">
          <label for="prefix">Prefix</label>
          <input type="number" id="prefix" placeholder="24" min="0" max="32">
        </div>
        <button class="btn-calc" onclick="hitungSubnet()">Hitung</button>
      </div>
      <div id="subnet-err" class="error-banner" hidden></div>

      <div id="subnet-result" class="result" hidden>
        <div class="success-badge"><span class="dot"></span> Sukses</div>
        <div class="result-grid">
          <div class="result-item">
            <div class="result-label">Subnet Mask</div>
            <div class="result-value" id="res-mask">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Usable Hosts</div>
            <div class="result-value accent" id="res-hosts">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Network Address</div>
            <div class="result-value" id="res-network">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Broadcast Address</div>
            <div class="result-value" id="res-broadcast">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">First Host</div>
            <div class="result-value" id="res-first">—</div>
          </div>
          <div class="result-item">
            <div class="result-label">Last Host</div>
            <div class="result-value" id="res-last">—</div>
          </div>
        </div>
        <div id="res-special" style="margin-top:12px"></div>
      </div>
    </div>
  </div>

  <!-- VLSM PANEL -->
  <div id="panel-vlsm" role="tabpanel" hidden>
    <div class="card">
      <div class="vlsm-network-row">
        <div class="field">
          <label for="vlsm-network">Network (CIDR)</label>
          <input type="text" id="vlsm-network" placeholder="192.168.1.0/24" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="vlsm-hosts-label">Kebutuhan Host</div>
      <div id="host-rows"></div>
      <button class="btn-add" onclick="tambahBaris()">+ Tambah kebutuhan</button>

      <div id="vlsm-err" class="error-banner" hidden></div>

      <div class="vlsm-actions">
        <button class="btn-calc" onclick="hitungVLSM()">Hitung VLSM</button>
      </div>

      <div id="vlsm-result" class="table-wrap" hidden>
        <div class="success-badge"><span class="dot"></span> Sukses</div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Kebutuhan</th>
              <th>Network CIDR</th>
              <th>Range Host</th>
              <th>Usable</th>
            </tr>
          </thead>
          <tbody id="vlsm-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  /* ── Tab switch ── */
  function switchTab(name) {
    ['subnet','vlsm'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('active', t === name);
      document.getElementById('tab-' + t).setAttribute('aria-selected', t === name);
      document.getElementById('panel-' + t).hidden = t !== name;
    });
  }

  /* ── VLSM baris kebutuhan ── */
  let barisCount = 0;
  function tambahBaris(value = '') {
    barisCount++;
    const id = 'host-' + barisCount;
    const wrap = document.getElementById('host-rows');
    const div = document.createElement('div');
    div.className = 'host-row';
    div.id = 'row-' + id;
    div.innerHTML = `
      <input type="number" id="${id}" placeholder="Jumlah host, misal 50" min="1" value="${value}">
      <button class="btn-remove" onclick="hapusBaris('row-${id}')" aria-label="Hapus baris">×</button>`;
    wrap.appendChild(div);
  }
  function hapusBaris(rowId) {
    const el = document.getElementById(rowId);
    if (el) el.remove();
  }
  // Seed 3 baris awal
  tambahBaris(100); tambahBaris(50); tambahBaris(20);

  /* ── Validasi & hitung (lokal, digunakan saat backend tidak tersedia) ── */
  function ipToInt(ip) {
    // tolak spasi
    if (ip !== ip.trim()) throw new Error('Alamat IP tidak boleh mengandung spasi.');
    const parts = ip.split('.');
    if (parts.length !== 4) throw new Error('Alamat IP harus tepat 4 oktet.');
    return parts.reduce((acc, part) => {
      if (!/^\d+$/.test(part)) throw new Error(`Oktet "${part}" bukan angka valid.`);
      if (part.length > 1 && part[0] === '0') throw new Error(`Oktet "${part}" mengandung angka nol di depan.`);
      const n = parseInt(part, 10);
      if (n < 0 || n > 255) throw new Error(`Oktet "${part}" di luar rentang 0–255.`);
      return (acc << 8) | n;
    }, 0) >>> 0;
  }
  function intToIp(n) {
    return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
  }
  function hitungLokal(ip, prefix) {
    if (!ip) throw new Error('Alamat IP tidak boleh kosong.');
    const p = parseInt(prefix, 10);
    if (isNaN(p) || !Number.isInteger(p) || p < 0 || p > 32)
      throw new Error('Prefix harus bilangan bulat 0–32.');
    const ipInt = ipToInt(ip);
    const maskInt = p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0;
    const netInt  = (ipInt & maskInt) >>> 0;
    const mask    = intToIp(maskInt);
    const network = intToIp(netInt);
    if (p === 32) return { mask, network, broadcast: null, first_host: ip, last_host: ip, usable_hosts: 1, special: '/32 — host route' };
    if (p === 31) {
      const a = intToIp(netInt), b = intToIp((netInt | 1) >>> 0);
      return { mask, network, broadcast: null, first_host: a, last_host: b, usable_hosts: 2, special: '/31 — RFC 3021 point-to-point' };
    }
    const wildcard  = (~maskInt) >>> 0;
    const bcInt     = (netInt | wildcard) >>> 0;
    const broadcast = intToIp(bcInt);
    const first     = intToIp((netInt + 1) >>> 0);
    const last      = intToIp((bcInt - 1) >>> 0);
    const usable    = Math.pow(2, 32 - p) - 2;
    return { mask, network, broadcast, first_host: first, last_host: last, usable_hosts: usable, special: null };
  }

  function alokasi(networkCidr, kebutuhanList) {
    const [netIp, prefStr] = networkCidr.split('/');
    const netPrefix = parseInt(prefStr, 10);
    if (!netIp || isNaN(netPrefix)) throw new Error('Format network CIDR tidak valid.');
    const netInt = ipToInt(netIp);
    const maskInt = netPrefix === 0 ? 0 : (0xFFFFFFFF << (32 - netPrefix)) >>> 0;
    if ((netInt & maskInt) >>> 0 !== netInt) throw new Error('network_cidr bukan alamat jaringan (host bit aktif).');
    if (!kebutuhanList.length) throw new Error('Daftar kebutuhan host kosong.');
    kebutuhanList.forEach(k => { if (k < 1) throw new Error('Nilai kebutuhan harus ≥ 1.'); });

    const urut = [...kebutuhanList].map((k,i) => ({k,i})).sort((a,b) => b.k - a.k);
    const totalAlamat = Math.pow(2, 32 - netPrefix);
    const totalDibutuhkan = urut.reduce((s, {k}) => {
      let size = 2;
      while (size < k + 2) size *= 2;
      return s + size;
    }, 0);
    if (totalDibutuhkan > totalAlamat) throw new Error('Ruang alamat tidak cukup untuk seluruh kebutuhan.');

    let ptr = netInt;
    return urut.map(({k}) => {
      let size = 2;
      while (size < k + 2) size *= 2;
      const blokPrefix = 32 - Math.log2(size);
      const sub = hitungLokal(intToIp(ptr), blokPrefix);
      const cidr = intToIp(ptr) + '/' + blokPrefix;
      ptr = (ptr + size) >>> 0;
      return { kebutuhan: k, network_cidr: cidr, ...sub };
    });
  }

  /* ── Subnet UI ── */
  async function hitungSubnet() {
    const ip     = document.getElementById('ip').value;
    const prefix = document.getElementById('prefix').value;
    const errEl  = document.getElementById('subnet-err');
    const resEl  = document.getElementById('subnet-result');
    errEl.hidden = true;
    resEl.hidden = true;
    document.getElementById('ip').classList.remove('error-input');

    try {
      const r = await fetch(`/api/subnet?ip=${encodeURIComponent(ip)}&prefix=${encodeURIComponent(prefix)}`);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        throw new Error(data.detail || `HTTP ${r.status}`);
      }

      document.getElementById('res-mask').textContent     = data.mask;
      document.getElementById('res-hosts').textContent    = data.usable_hosts.toLocaleString('id-ID');
      document.getElementById('res-network').textContent  = data.network;
      document.getElementById('res-broadcast').textContent= data.broadcast ?? '— (tidak ada)';
      document.getElementById('res-first').textContent    = data.first_host;
      document.getElementById('res-last').textContent     = data.last_host;
      const sp = document.getElementById('res-special');
      sp.innerHTML = data.special ? `<span class="result-badge">${data.special}</span>` : '';
      resEl.hidden = false;
    } catch (e) {
      document.getElementById('ip').classList.add('error-input');
      errEl.textContent = e.message;
      errEl.hidden = false;
    }
  }

  /* ── VLSM UI ── */
  async function hitungVLSM() {
    const network = document.getElementById('vlsm-network').value;
    const errEl   = document.getElementById('vlsm-err');
    const resEl   = document.getElementById('vlsm-result');
    errEl.hidden  = true;
    resEl.hidden  = true;
    document.getElementById('vlsm-network').classList.remove('error-input');

    const inputs  = document.querySelectorAll('#host-rows input[type="number"]');
    const kebutuhan = [];
    for (const inp of inputs) {
      const v = parseInt(inp.value, 10);
      if (!isNaN(v)) kebutuhan.push(v);
    }

    try {
      const r = await fetch('/api/vlsm', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ network, kebutuhan_host: kebutuhan })
      });
      const hasil = await r.json().catch(() => ({}));
      if (!r.ok) {
        throw new Error(hasil.detail || `HTTP ${r.status}`);
      }

      const tbody = document.getElementById('vlsm-tbody');
      tbody.innerHTML = '';
      hasil.forEach((row, i) => {
        const tr = document.createElement('tr');
        const range = row.broadcast
          ? `${row.first_host} – ${row.last_host}`
          : `${row.first_host} / ${row.last_host}`;
        tr.innerHTML = `
          <td class="num">${i+1}</td>
          <td class="num">${row.kebutuhan}</td>
          <td class="cidr">${row.network_cidr}</td>
          <td>${range}</td>
          <td class="num">${row.usable_hosts.toLocaleString('id-ID')}</td>`;
        tbody.appendChild(tr);
      });
      resEl.hidden = false;
    } catch (e) {
      document.getElementById('vlsm-network').classList.add('error-input');
      errEl.textContent = e.message;
      errEl.hidden = false;
    }
  }

  /* Enter key support */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.activeElement.closest('#panel-subnet')) hitungSubnet();
    else if (document.activeElement.closest('#panel-vlsm')) hitungVLSM();
  });
</script>

</body></html>
